set_nanoe:
  name: Set nanoe G
  description: Turn on or off the nanoe G feature of a Panasonic MirAIe air conditioner.
  target:
    entity:
      integration: panasonic_miraie
      domain: climate
  fields:
    state:
      name: State
      description: Turn on or off nanoe G.
      example: true
      required: true
      selector:
        boolean:

